name: Publish to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@swayamkothari345'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        # GitHub Packages requires the scope to match the GitHub username.
        # Skip gracefully if this version is already published.
        run: |
          npm pkg set name="@swayamkothari345/codepulse"
          CURRENT=$(npm view @swayamkothari345/codepulse version --registry https://npm.pkg.github.com 2>/dev/null || echo "")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$PKG_VERSION" ]; then
            echo "Version $PKG_VERSION already published to GitHub Packages, skipping."
          else
            npm publish
          fi
          npm pkg set name="@swayamkothari/codepulse"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
