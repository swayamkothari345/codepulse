name: Publish to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@swayamkothari345'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        # GitHub Packages requires the scope to match the GitHub username,
        # which differs from the npm username. Override only for this step.
        run: |
          npm pkg set name="@swayamkothari345/codepulse"
          npm publish
          npm pkg set name="@swayamkothari/codepulse"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
